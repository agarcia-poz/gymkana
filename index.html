  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body { background: radial-gradient(900px 420px at 110% -10%, #D7EBFD 0%, rgba(215,235,253,0) 60%), radial-gradient(700px 400px at -20% 110%, #DCEEFE 0%, rgba(220,238,254,0) 60%), var(--bg); background-attachment: fixed; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  /* cabecera */
  header { position: relative; overflow: hidden; padding: 16px 18px 14px; background: linear-gradient(180deg, #FFFFFF 0%, #E4F1FD 100%); border-bottom: 1px solid var(--line); }
  header .deco { position: absolute; right: -18px; top: -14px; width: 120px; height: 120px; opacity: .9; pointer-events: none; }
  .brandrow { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .logo { width: 70px; aspect-ratio: 480 / 296; background: var(--blue); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; flex: none; }
  .titles { line-height: 1; }
  .t1 { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: .02em; color: var(--navy); }
  .t2 { font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 27px; letter-spacing: -.01em; background: linear-gradient(180deg, #0B2E6B 10%, #0A77BD 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: 1px; }
  .pill { display: inline-block; margin-top: 10px; background: var(--sky); color: var(--navy); font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 99px; position: relative; z-index: 1; }
  .teambar { margin: 12px 16px 0; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: none; box-shadow: 0 10px 28px -20px rgba(11,79,168,.45); }
  .teambar.on { display: block; }
  .team { display: flex; align-items: center; gap: 10px; }
  .team .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--team); box-shadow: 0 0 0 3px color-mix(in srgb, var(--team) 22%, transparent); flex: none; }
  .team .name { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; color: var(--navy); }
  .team .code { margin-left: auto; font-size: 13px; color: var(--muted); letter-spacing: .14em; font-weight: 700; }
  .progress { display: none; margin-top: 10px; }
  .progress.on { display: block; }
  .bar { height: 9px; border-radius: 99px; background: var(--pale); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--grad); width: 0; transition: width .6s ease; border-radius: 99px; }
  .progress small { display: block; margin-top: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
  main { flex: 1; padding: 14px 16px 120px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 12px 30px -22px rgba(11,79,168,.5); }
  .card + .card, .callout + .card { margin-top: 14px; }
  .eyebrow { font-family: 'Poppins', sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--bright); }
  h1, h2 { font-family: 'Poppins', sans-serif; font-weight: 800; margin: 6px 0 10px; line-height: 1.15; color: var(--navy); }
  h1 { font-size: 26px; } h2 { font-size: 21px; }
  .found { display: flex; gap: 12px; align-items: center; background: var(--ok-soft); border-color: #C7E8D6; }
  .found .tick { width: 42px; height: 42px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
  .found .place { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; color: var(--ink); }
  .found .sub { font-size: 14px; color: var(--muted); }
  .callout { border-radius: 14px; padding: 12px 14px; font-size: 15.5px; margin-top: 12px; }
  .callout.prueba { background: var(--pale); border: 1.5px dashed #9CC7F2; color: var(--navy); }
  .callout.aviso { background: var(--warn-soft); border: 1px solid #F2D49B; }
  .clue { position: relative; overflow: hidden; }
  .clue::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--grad); }
  .clue p { margin: 0; font-size: 18.5px; line-height: 1.55; }
  .dir { margin-top: 14px; display: flex; gap: 8px; align-items: flex-start; background: var(--pale); border-radius: 12px; padding: 10px 12px; color: var(--navy); font-weight: 700; font-size: 15.5px; }
  .hint { text-align: center; color: var(--muted); font-size: 14.5px; margin: 18px 6px 0; }
  .big { text-align: center; padding: 28px 18px; }
  .big .emoji { font-size: 54px; line-height: 1; }
  .dark { background: var(--grad); color: #fff; border: none; }
  .dark h1, .dark h2 { color: #fff; } .dark .eyebrow { color: #BFE0FF; }
  .stats { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
  .stats div { background: rgba(255,255,255,.14); border-radius: 14px; padding: 10px 16px; }
  .stats b { display: block; font-family: 'Poppins', sans-serif; font-size: 26px; line-height: 1.1; }
  .stats span { font-size: 13px; opacity: .85; }
  /* sala de espera */
  .wait { text-align: center; padding: 30px 20px; }
  .wait .pulse { width: 96px; height: 96px; margin: 6px auto 18px; border-radius: 50%; background: var(--team); position: relative; display: grid; place-items: center; color: #fff; font-size: 40px; }
  .wait .pulse::before, .wait .pulse::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--team); animation: ring 2.2s ease-out infinite; }
  .wait .pulse::after { animation-delay: 1.1s; }
  @keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
  .wait .count { display: inline-block; margin-top: 8px; background: var(--pale); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font-weight: 700; color: var(--navy); }
  .go { background: linear-gradient(135deg, #1F8A55, #2BB673); color: #fff; border: none; text-align: center; }
  .go h1 { color: #fff; }
  label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--navy); }
  input[type=text], textarea { width: 100%; font: inherit; padding: 14px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
  input.code { text-transform: uppercase; letter-spacing: .3em; font-size: 26px; text-align: center; font-weight: 800; font-family: 'Poppins', sans-serif; color: var(--navy); }
  input:focus, textarea:focus { outline: none; border-color: var(--bright); box-shadow: 0 0 0 3px rgba(30,136,229,.18); }
  button { font: inherit; cursor: pointer; border: none; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 14px; background: var(--grad); color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 16.5px; margin-top: 12px; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .6; }
  .link { background: none; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 6px; }
  .err { color: var(--err); font-weight: 700; margin-top: 10px; font-size: 15px; }
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; width: calc(100% - 32px); max-width: 488px; display: flex; gap: 10px; z-index: 5; }
  .fab button { padding: 15px 14px; border-radius: 16px; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 16px; box-shadow: 0 14px 30px -12px rgba(11,46,107,.55); }
  .fab .scan { flex: 2; background: var(--grad); color: #fff; }
  .fab .help { flex: 1; background: #fff; color: var(--navy); border: 1.5px solid var(--line); position: relative; }
  .badge { position: absolute; top: -7px; right: -5px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--err); color: #fff; font-size: 13px; display: none; place-items: center; font-family: 'Nunito Sans', sans-serif; }
  .badge.on { display: grid; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--bright); animation: spin 0.9s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pop { animation: pop .45s ease; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  /* chat */
  .sheet { position: fixed; inset: 0; background: rgba(11,30,60,.45); display: none; z-index: 10; }
  .sheet.on { display: block; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0; height: 82vh; display: flex; flex-direction: column; animation: up .25s ease; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .panel-h { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .panel-h b { font-family: 'Poppins', sans-serif; font-size: 17px; color: var(--navy); }
  .panel-h button { margin-left: auto; background: none; font-size: 26px; color: var(--muted); line-height: 1; padding: 4px 8px; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 9px 12px; border-radius: 16px; font-size: 15.5px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 4px; }
  .msg.admin { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.all { align-self: center; background: var(--err-soft); border: 1px solid #F5BDBD; text-align: center; max-width: 92%; }
  .msg time { display: block; font-size: 11.5px; opacity: .65; margin-top: 3px; }
  .empty { color: var(--muted); text-align: center; margin: auto; font-size: 15px; padding: 20px; }
  .quick { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px; }
  .quick button { flex: none; background: #fff; border: 1px solid var(--line); padding: 8px 12px; border-radius: 99px; font-size: 14px; color: var(--navy); font-weight: 700; }
  .composer { display: flex; gap: 8px; padding: 10px 14px 16px; border-top: 1px solid var(--line); background: var(--bg); }
  .composer textarea { resize: none; height: 48px; padding: 12px; font-size: 16px; }
  .composer button { background: var(--grad); color: #fff; border-radius: 12px; padding: 0 16px; font-weight: 700; }
  /* avisos a pantalla completa */
  .alert { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 28px 22px; text-align: center; color: #fff; }
  .alert.on { display: flex; animation: flash .5s ease; }
  .alert.all { background: var(--alert); }
  .alert.dm { background: var(--grad); }
  @keyframes flash { 0% { opacity: 0; transform: scale(1.04); } 100% { opacity: 1; transform: none; } }
  .alert .ico { font-size: 64px; line-height: 1; animation: shake 1s ease 2; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  .alert .lbl { margin-top: 14px; font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .9; }
  .alert .txt { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.25; margin: 14px 0 28px; max-width: 480px; white-space: pre-wrap; word-wrap: break-word; }
  .alert .row { display: flex; gap: 10px; width: 100%; max-width: 420px; }
  .alert button { flex: 1; padding: 16px; border-radius: 14px; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 17px; background: #fff; color: var(--ink); }
  .alert button.ghost { background: rgba(255,255,255,.15); color: #fff; border: 1.5px solid rgba(255,255,255,.6); }
  /* escáner */
  .scanner { position: fixed; inset: 0; z-index: 25; background: #000; display: none; flex-direction: column; }
  .scanner.on { display: flex; }
  .scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scanner .frame { position: absolute; left: 50%; top: 46%; width: 68vmin; height: 68vmin; transform: translate(-50%, -50%); border-radius: 24px; box-shadow: 0 0 0 100vmax rgba(5,20,45,.6); }
  .scanner .frame::before { content: ''; position: absolute; inset: -3px; border-radius: 26px; border: 4px solid #6FB6F5; }
  .scanner .frame::after { content: ''; position: absolute; left: 8%; right: 8%; height: 3px; top: 10%; background: #8FD0FF; box-shadow: 0 0 14px #8FD0FF; animation: scan 2s ease-in-out infinite alternate; }
  @keyframes scan { to { top: 88%; } }
  .scanner .top { position: relative; z-index: 2; display: flex; align-items: center; padding: 16px; color: #fff; }
  .scanner .top b { font-family: 'Poppins', sans-serif; font-size: 18px; }
  .scanner .top button { margin-left: auto; background: rgba(255,255,255,.15); color: #fff; width: 42px; height: 42px; border-radius: 50%; font-size: 24px; line-height: 1; }
  .scanner .bottom { position: relative; z-index: 2; margin-top: auto; padding: 18px 18px 26px; text-align: center; color: #fff; }
  .scanner .bottom p { margin: 0 0 14px; font-size: 16px; }
  .scanner .bottom .btn { background: #fff; color: var(--navy); }
  .scanner .status { min-height: 22px; color: #BFE0FF; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; z-index: 40; display: none; max-width: 90%; text-align: center; }
  .toast.on { display: block; animation: pop .3s ease; }
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="deco" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M30 40 h18 a12 12 0 1 1 24 0 h18 v18 a12 12 0 1 1 0 24 v18 h-60 z" fill="#B9DBFA"/>
      <path d="M46 66 q16 -22 40 -18" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 6"/>
      <circle cx="44" cy="68" r="5" fill="#1E88E5"/>
    </svg>
    <div class="brandrow">
      <div class="logo" role="img" aria-label="Centro Universitario Sagrada Familia"></div>
      <div class="titles"><div class="t1">PIEZAS DE UNA</div><div class="t2">VOCACIÓN</div></div>
    </div>
    <div class="pill">Gymkana de orientación · Levántate y anda</div>
  </header>
  <div class="teambar" id="teambar">
    <div class="team" id="team"><span class="dot"></span><span class="name" id="teamName"></span><span class="code" id="teamCode"></span></div>
    <div class="progress" id="progress"><div class="bar"><i id="barFill"></i></div><small id="progressTxt"></small></div>
  </div>
  <main id="main"><div class="spinner"></div></main>
</div>

<div class="fab" id="fab" style="display:none">
  <button class="scan" id="openScan">📷 Escanear QR</button>
  <button class="help" id="openChat">💬 Ayuda<span class="badge" id="badge">0</span></button>
</div>

<!-- Escáner -->
<div class="scanner" id="scanner">
  <video id="video" playsinline muted></video>
  <div class="frame" id="frame"></div>
  <div class="top"><b>Escanear QR</b><button id="closeScan" aria-label="Cerrar">×</button></div>
  <div class="bottom">
    <div class="status" id="scanStatus"></div>
    <p id="scanHelp">Apunta al código QR del lugar. Se leerá solo.</p>
    <button class="btn" id="photoBtn">📸 Hacer una foto al QR</button>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
  </div>
</div>

<!-- Chat -->
<div class="sheet" id="sheet">
  <div class="panel">
    <div class="panel-h"><b>Chat con la coordinación</b><button id="closeChat" aria-label="Cerrar">×</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick">
      <button data-q="No encontramos el QR de este lugar.">🔍 No encontramos el QR</button>
      <button data-q="El QR no funciona al escanearlo.">⚠️ El QR no funciona</button>
      <button data-q="No entendemos la pista.">🤔 No entendemos la pista</button>
      <button data-q="La prueba está ocupada, estamos esperando.">⏳ Prueba ocupada</button>
      <button data-q="Necesitamos ayuda, por favor.">🆘 Necesitamos ayuda</button>
    </div>
    <div class="composer">
      <textarea id="txt" placeholder="Escribe un mensaje…" maxlength="500"></textarea>
      <button id="send">Enviar</button>
    </div>
  </div>
</div>

<!-- Aviso a pantalla completa -->
<div class="alert" id="alert">
  <div class="ico" id="alertIco">📣</div>
  <div class="lbl" id="alertLbl">Aviso de la coordinación</div>
  <div class="txt" id="alertTxt"></div>
  <div class="row"><button class="ghost hidden" id="alertReply">Responder</button><button id="alertOk">Entendido</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
  var INIT = (function () {
    var p = new URLSearchParams(location.search), limpio = function (v) { return String(v || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 20); };
    return { q: limpio(p.get('q')).toUpperCase(), t: limpio(p.get('t')).toUpperCase() };
  })();
  // Se limpia la dirección para que recargar la página no vuelva a escanear el mismo QR
  if (INIT.q || INIT.t) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  var KEY = 'pdv_equipo';
  var POLL_MS = 4000;
  var S = { codigo: null, equipo: null, ver: 0, ultimoTs: -1, pantalla: null, mensajes: [], chatOpen: false, poll: null, busy: false, cola: [] };

  function $(id) { return document.getElementById(id); }
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    var url = window.GYMKANA_API || '';
    if (!url || /PEGA_AQUI/.test(url)) return Promise.reject(new Error('Falta configurar la dirección de Apps Script en config.js.'));
    var ctrl = window.AbortController ? new AbortController() : null, tm = ctrl && setTimeout(function () { ctrl.abort(); }, 20000);
    // text/plain evita la petición previa de CORS; Apps Script la acepta igual
    return fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('Sin conexión con el servidor (' + r.status + ')'); return r.json(); })
      .then(function (j) { clearTimeout(tm); if (!j.ok) throw new Error(j.error); return j.result; })
      .catch(function (e) { clearTimeout(tm); if (e && e.name === 'AbortError') throw new Error('El servidor tarda en responder. Inténtalo de nuevo.'); if (e instanceof SyntaxError) throw new Error('No se puede leer la respuesta del servidor. Revisa que la aplicación web esté publicada para «Cualquier usuario».'); if (e instanceof TypeError) throw new Error('No hay conexión con el servidor. Comprueba la conexión a internet.'); throw e; });
  }
  var MEM = {};
  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
    catch (e) { if (v === undefined) return k in MEM ? MEM[k] : null; if (v === null) delete MEM[k]; else MEM[k] = v; return null; }
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function toast(t) { var x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { x.classList.remove('on'); }, 3200); }
  function hora(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function cleanMsg(e) { return String(e && e.message || e).replace(/^Exception:\s*/, '').replace(/^Error:\s*/, ''); }
  function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // ───── Pantallas ─────
  function render(nodes) { var m = $('main'); m.innerHTML = ''; nodes.forEach(function (n) { if (n) m.appendChild(n); }); m.firstChild && m.firstChild.classList.add('pop'); window.scrollTo(0, 0); }

  function pantallaLogin(error) {
    $('fab').style.display = 'none';
    var c = el('div', 'card');
    c.appendChild(el('div', 'eyebrow', 'Bienvenida'));
    c.appendChild(el('h1', '', 'Entrad con vuestro equipo'));
    c.appendChild(el('p', '', 'Escribid el código de 4 letras que aparece en la tarjeta de vuestro equipo. Solo hay que hacerlo una vez.'));
    var lb = el('label', '', 'Código del equipo'); lb.setAttribute('for', 'code');
    var inp = el('input', 'code'); inp.type = 'text'; inp.id = 'code'; inp.maxLength = 6; inp.autocomplete = 'off'; inp.autocapitalize = 'characters';
    var b = el('button', 'btn', 'Entrar');
    var e = el('div', 'err', error || '');
    function go() {
      var v = inp.value.trim().toUpperCase(); if (!v) return;
      b.disabled = true; b.textContent = 'Comprobando…';
      api('apiJoin', v).then(function (eq) { setEquipo(eq); continuar(); })
        .catch(function (er) { b.disabled = false; b.textContent = 'Entrar'; e.textContent = cleanMsg(er); });
    }
    b.onclick = go; inp.onkeydown = function (ev) { if (ev.key === 'Enter') go(); };
    c.appendChild(lb); c.appendChild(inp); c.appendChild(b); c.appendChild(e);
    render([c]); setTimeout(function () { inp.focus(); }, 200);
  }

  function pantallaError(t, volver) {
    var c = el('div', 'card big');
    c.appendChild(el('div', 'emoji', '🧭'));
    c.appendChild(el('h2', '', 'Algo no ha ido bien'));
    c.appendChild(el('p', '', t));
    var b = el('button', 'btn', volver ? 'Volver a mi pista' : 'Volver a intentarlo');
    b.onclick = function () { if (volver) { S.ultimoTs = -1; S.ver = 0; poll(); } else location.reload(); };
    c.appendChild(b);
    render([c]);
    $('fab').style.display = S.codigo ? 'flex' : 'none';
  }

  function tarjetaPista(titulo, pista) {
    var c = el('div', 'card clue');
    c.appendChild(el('div', 'eyebrow', titulo));
    c.appendChild(el('p', '', pista.texto));
    if (pista.direccion) {
      var d = el('div', 'dir'); d.appendChild(el('span', '', '🧭')); d.appendChild(el('span', '', pista.direccion)); c.appendChild(d);
    }
    return c;
  }

  function salaEspera(r) {
    var c = el('div', 'card wait');
    c.appendChild(el('div', 'pulse', '⏳'));
    c.appendChild(el('div', 'eyebrow', 'Sala de espera'));
    c.appendChild(el('h1', '', '¡Preparados!'));
    c.appendChild(el('p', '', 'Vuestro equipo ya está dentro. Cuando la coordinación dé la salida, aparecerá aquí vuestra primera pista, a la vez que al resto de equipos.'));
    var n = el('div', 'count', ''); n.id = 'waitCount'; c.appendChild(n);
    var t = el('p', 'hint', 'No cerréis esta pantalla.');
    return [c, t];
  }
  function pintarConectados(n, total) {
    var x = $('waitCount'); if (!x) return;
    x.textContent = '👥 ' + n + (total ? ' de ' + total : '') + ' equipos conectados';
  }

  function mostrar(r) {
    var veniaDeEspera = S.pantalla === 'espera';
    S.ultimoTs = r.ultimoTs; S.pantalla = r.pantalla;
    pintarCabecera(r);
    var nodos = [];
    if (r.pantalla === 'espera') {
      nodos = salaEspera(r);
      render(nodos); pintarConectados(r.conectados, r.totalEquipos); S.totalEquipos = r.totalEquipos;
      $('fab').style.display = 'flex'; $('openScan').style.display = 'none';
      return;
    }
    if (r.pantalla === 'terminada') {
      var tc = el('div', 'card big dark');
      tc.appendChild(el('div', 'emoji', '🏁'));
      tc.appendChild(el('div', 'eyebrow', 'Fin de la gymkana'));
      tc.appendChild(el('h1', '', '¡Gracias por caminar juntos!'));
      tc.appendChild(el('p', '', r.mensaje));
      var st = el('div', 'stats');
      var s1 = el('div'); s1.appendChild(el('b', '', String(r.progreso.hechos))); s1.appendChild(el('span', '', 'lugares encontrados')); st.appendChild(s1);
      if (r.finalizado) { var s2 = el('div'); s2.appendChild(el('b', '', '✓')); s2.appendChild(el('span', '', 'reto final')); st.appendChild(s2); }
      tc.appendChild(st);
      render([tc]);
      $('fab').style.display = 'flex'; $('openScan').style.display = 'none';
      return;
    }
    $('openScan').style.display = '';
    if (r.pantalla === 'inicio') {
      if (veniaDeEspera) {
        var g = el('div', 'card go big'); g.appendChild(el('div', 'emoji', '🚩')); g.appendChild(el('h1', '', '¡Comienza la gymkana!')); g.appendChild(el('p', '', 'Levántate y anda: ¡a por la primera pista!'));
        nodos.push(g); vibrar([200, 100, 200]);
      } else {
        var c0 = el('div', 'card');
        c0.appendChild(el('div', 'eyebrow', '¡Empieza la aventura!'));
        c0.appendChild(el('h2', '', 'Vuestro punto de partida'));
        c0.appendChild(el('p', '', 'Resolved la pista para encontrar vuestro primer lugar. Allí habrá un QR: pulsad «Escanear QR».'));
        nodos.push(c0);
      }
      nodos.push(tarjetaPista('Vuestra primera pista', r.pista));
    } else if (r.pantalla === 'pista') {
      var f = el('div', 'card found');
      f.appendChild(el('div', 'tick', '✓'));
      var t = el('div'); t.appendChild(el('div', 'place', r.punto.nombre));
      t.appendChild(el('div', 'sub', r.manual ? 'Validado por la coordinación' : r.repetido === null ? 'Último lugar registrado' : r.repetido ? 'Este punto ya estaba registrado' : '¡Punto encontrado!'));
      f.appendChild(t); nodos.push(f);
      if (r.punto.tipo === 'prueba') {
        var pr = el('div', 'callout prueba'); pr.innerHTML = '<b>🧩 Aquí hay una prueba.</b> Superadla con el monitor para conseguir vuestra letra antes de seguir.'; nodos.push(pr);
      }
      if (r.aviso) nodos.push(el('div', 'callout aviso', r.aviso));
      nodos.push(tarjetaPista('Siguiente pista', r.pista));
      nodos.push(el('p', 'hint', 'Cuando encontréis el siguiente lugar, pulsad «Escanear QR».'));
    } else if (r.pantalla === 'vuelta') {
      var v = el('div', 'card big');
      v.appendChild(el('div', 'emoji', '🏁'));
      v.appendChild(el('h1', '', '¡Recorrido completado!'));
      v.appendChild(el('p', '', r.mensaje));
      nodos.push(v);
    } else if (r.pantalla === 'final') {
      var fi = el('div', 'card big dark');
      fi.appendChild(el('div', 'emoji', '✨'));
      fi.appendChild(el('div', 'eyebrow', 'Reto final'));
      fi.appendChild(el('h1', '', 'Levántate y anda'));
      fi.appendChild(el('p', '', r.mensaje));
      nodos.push(fi);
      $('openScan').style.display = 'none';
    }
    var sw = el('p', 'hint'); var lk = el('button', 'link', '¿No es vuestro equipo? Cambiar de equipo');
    lk.onclick = function () { if (confirm('¿Salir de este equipo en este móvil?')) { store(KEY, null); location.reload(); } };
    sw.appendChild(lk); nodos.push(sw);
    render(nodos);
    $('fab').style.display = 'flex';
  }

  function pintarCabecera(r) {
    var eq = r.equipo || S.equipo; if (!eq) return;
    S.equipo = eq;
    document.documentElement.style.setProperty('--team', eq.color || '#1F3864');
    $('teamName').textContent = eq.nombre; $('teamCode').textContent = eq.codigo; $('teambar').classList.add('on');
    if (r.progreso) {
      $('progress').classList.add('on');
      $('barFill').style.width = Math.round(100 * r.progreso.hechos / r.progreso.total) + '%';
      $('progressTxt').textContent = r.progreso.hechos + ' de ' + r.progreso.total + ' lugares encontrados';
    } else if (r.pantalla === 'espera') $('progress').classList.remove('on');
  }

  // ───── Flujo ─────
  function setEquipo(eq) { S.codigo = eq.codigo; S.equipo = eq; store(KEY, eq.codigo); pintarCabecera({ equipo: eq }); }

  function escanear(token) {
    render([el('div', 'spinner')]);
    return api('apiScan', S.codigo, token).then(function (r) { mostrar(r); vibrar(120); })
      .catch(function (e) {
        var m = cleanMsg(e);
        if (/ningún equipo/.test(m)) { store(KEY, null); INIT.q = token; pantallaLogin(m); return; }
        if (/no ha empezado|ha terminado/.test(m)) { S.ultimoTs = -1; S.ver = 0; toast(m); poll(); return; }
        pantallaError(m, true);
      });
  }

  function continuar() {
    if (INIT.q) {
      var q = INIT.q; INIT.q = '';
      escanear(q).then(arrancarPoll);
    } else {
      api('apiState', S.codigo, 0).then(function (r) { S.ver = r.ver; mostrar(r); procesarMensajes(r.mensajes || [], true); arrancarPoll(); })
        .catch(function (e) { store(KEY, null); pantallaLogin(cleanMsg(e)); });
    }
  }

  function arrancarPoll() { if (S.poll) return; S.poll = setInterval(poll, POLL_MS); setTimeout(poll, 1200); }
  function poll() {
    if (!S.codigo || document.hidden || S.busy) return;
    S.busy = true;
    var enEspera = S.pantalla === 'espera';
    api('apiState', S.codigo, S.ver, enEspera).then(function (r) {
      S.busy = false;
      if (r.same) { if (enEspera && r.conectados !== undefined) pintarConectados(r.conectados, S.totalEquipos); return; }
      S.ver = r.ver;
      var especial = function (p) { return p === 'espera' || p === 'terminada'; };
      if (r.ultimoTs !== S.ultimoTs || r.pantalla !== S.pantalla && (especial(r.pantalla) || especial(S.pantalla))) mostrar(r);
      else { pintarCabecera(r); if (r.pantalla === 'espera') pintarConectados(r.conectados, r.totalEquipos); }
      procesarMensajes(r.mensajes || []);
    }).catch(function () { S.busy = false; });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });

  // ───── Mensajes y avisos ─────
  function visto() { return Number(store('pdv_visto_' + S.codigo) || 0); }
  function procesarMensajes(lista, primeraCarga) {
    S.mensajes = lista.sort(function (a, b) { return a.ts - b.ts; });
    // Primera vez que este equipo entra en este móvil: los mensajes anteriores se dan por vistos
    // (siguen en el chat, pero no saltan como aviso).
    if (store('pdv_visto_' + S.codigo) === null) {
      var ultimo = S.mensajes.length ? S.mensajes[S.mensajes.length - 1].ts : 0;
      store('pdv_visto_' + S.codigo, String(ultimo || 1));
    }
    if (S.chatOpen) { pintarChat(); marcarVisto(); }
    var nuevos = S.mensajes.filter(function (m) { return m.de === 'admin' && m.ts > visto(); });
    $('badge').textContent = nuevos.length; $('badge').classList.toggle('on', nuevos.length > 0 && !S.chatOpen);
    // Aviso a pantalla completa: los avisos generales siempre; los mensajes directos si el chat está cerrado
    var avisos = nuevos.filter(function (m) { return (m.equipo === '*' || !S.chatOpen) && S.cola.indexOf(m.id) < 0 && m.id !== S.mostrando; });
    if (primeraCarga) avisos = avisos.filter(function (m) { return m.equipo === '*'; }).slice(-1);
    avisos.forEach(function (m) { S.cola.push(m.id); });
    siguienteAviso();
  }
  function siguienteAviso() {
    if (S.mostrando || !S.cola.length) return;
    var id = S.cola.shift(); var m = S.mensajes.filter(function (x) { return x.id === id; })[0];
    if (!m) return siguienteAviso();
    S.mostrando = id;
    var all = m.equipo === '*';
    var a = $('alert'); a.className = 'alert on ' + (all ? 'all' : 'dm');
    $('alertIco').textContent = all ? '📣' : '💬';
    $('alertLbl').textContent = all ? 'Aviso para todos los equipos · ' + hora(m.ts) : 'Mensaje de la coordinación · ' + hora(m.ts);
    $('alertTxt').textContent = m.texto;
    $('alertReply').classList.toggle('hidden', all);
    $('alertReply').style.display = all ? 'none' : '';
    vibrar(all ? [300, 120, 300, 120, 300] : [200, 100, 200]);
  }
  function cerrarAviso(abrirChat) {
    var m = S.mensajes.filter(function (x) { return x.id === S.mostrando; })[0];
    if (m && m.ts > visto()) store('pdv_visto_' + S.codigo, String(m.ts));
    S.mostrando = null; $('alert').className = 'alert';
    if (abrirChat) { $('openChat').onclick(); return; }
    procesarMensajes(S.mensajes);
    siguienteAviso();
  }
  $('alertOk').onclick = function () { cerrarAviso(false); };
  $('alertReply').onclick = function () { cerrarAviso(true); };

  function marcarVisto() { var u = S.mensajes.length ? S.mensajes[S.mensajes.length - 1].ts : 0; if (u > visto()) store('pdv_visto_' + S.codigo, String(u)); $('badge').classList.remove('on'); }
  function pintarChat() {
    var box = $('msgs'); box.innerHTML = '';
    if (!S.mensajes.length) { box.appendChild(el('div', 'empty', 'Si no encontráis un QR o tenéis cualquier problema, escribid aquí. La coordinación os responderá enseguida.')); return; }
    S.mensajes.forEach(function (m) {
      var cls = m.de === 'equipo' ? 'me' : (m.equipo === '*' ? 'all' : 'admin');
      var d = el('div', 'msg ' + cls);
      if (cls === 'all') d.appendChild(el('b', '', '📣 Aviso para todos\n'));
      d.appendChild(document.createTextNode(m.texto));
      d.appendChild(el('time', '', (cls === 'me' ? 'Vosotros' : 'Coordinación') + ' · ' + hora(m.ts)));
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
  }
  function enviar(texto) {
    texto = String(texto || '').trim(); if (!texto) return;
    S.mensajes.push({ id: 'tmp' + Date.now(), ts: Date.now(), equipo: S.codigo, de: 'equipo', texto: texto }); pintarChat();
    api('apiSend', S.codigo, texto).then(function () { setTimeout(poll, 300); }).catch(function (e) { toast('No se ha podido enviar: ' + cleanMsg(e)); });
  }
  $('openChat').onclick = function () { S.chatOpen = true; $('sheet').classList.add('on'); pintarChat(); marcarVisto(); setTimeout(function () { $('txt').focus(); }, 250); };
  $('closeChat').onclick = function () { S.chatOpen = false; $('sheet').classList.remove('on'); };
  $('sheet').onclick = function (e) { if (e.target === $('sheet')) $('closeChat').onclick(); };
  $('send').onclick = function () { enviar($('txt').value); $('txt').value = ''; };
  $('txt').onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').onclick(); } };
  Array.prototype.forEach.call(document.querySelectorAll('#quick button'), function (b) { b.onclick = function () { enviar(b.getAttribute('data-q')); }; });

  // ───── Escáner QR ─────
  var SC = { stream: null, timer: null, det: null, canvas: document.createElement('canvas') };
  function tokenDe(texto) {
    texto = String(texto || '').trim();
    var m = texto.match(/[?&]q=([A-Za-z0-9]+)/); if (m) return { q: m[1].toUpperCase() };
    var t = texto.match(/[?&]t=([A-Za-z0-9]+)/); if (t) return { t: t[1].toUpperCase() };
    if (/^[A-Za-z0-9]{6}$/.test(texto)) return { q: texto.toUpperCase() };
    return null;
  }
  function leido(texto) {
    var r = tokenDe(texto);
    if (!r) { $('scanStatus').textContent = 'Ese código no es de la gymkana. Probad con otro.'; return false; }
    if (r.t) { $('scanStatus').textContent = 'Esa es una tarjeta de equipo. Escanead el QR del lugar.'; return false; }
    cerrarEscaner();
    escanear(r.q);
    return true;
  }
  function abrirEscaner() {
    $('scanner').classList.add('on'); $('scanStatus').textContent = '';
    $('scanHelp').textContent = 'Apunta al código QR del lugar. Se leerá solo.';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { sinCamara(); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
      .then(function (stream) {
        SC.stream = stream; var v = $('video'); v.srcObject = stream; v.setAttribute('playsinline', ''); v.play();
        $('frame').style.display = '';
        if ('BarcodeDetector' in window) { try { SC.det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { SC.det = null; } }
        SC.timer = setInterval(leerFrame, 250);
      })
      .catch(function () { sinCamara(); });
  }
  function sinCamara() {
    $('frame').style.display = 'none';
    $('scanHelp').textContent = 'No se puede usar la cámara en directo en este móvil. Pulsad el botón y haced una foto al QR.';
  }
  function leerFrame() {
    var v = $('video'); if (!v.videoWidth || SC.leyendo) return;
    if (SC.det) {
      SC.leyendo = true;
      SC.det.detect(v).then(function (cs) { SC.leyendo = false; if (cs && cs.length) leido(cs[0].rawValue); }).catch(function () { SC.leyendo = false; SC.det = null; });
      return;
    }
    var w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
    SC.canvas.width = w; SC.canvas.height = h;
    var cx = SC.canvas.getContext('2d', { willReadFrequently: true }); cx.drawImage(v, 0, 0, w, h);
    var img = cx.getImageData(0, 0, w, h);
    var code = window.jsQR && jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
    if (code && code.data) leido(code.data);
  }
  function cerrarEscaner() {
    clearInterval(SC.timer); SC.timer = null;
    if (SC.stream) { SC.stream.getTracks().forEach(function (t) { t.stop(); }); SC.stream = null; }
    $('video').srcObject = null; $('scanner').classList.remove('on');
  }
  $('openScan').onclick = abrirEscaner;
  $('closeScan').onclick = cerrarEscaner;
  $('photoBtn').onclick = function () { $('photoInput').value = ''; $('photoInput').click(); };
  $('photoInput').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    $('scanStatus').textContent = 'Leyendo la foto…';
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var maxW = 1400, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, maxW / Math.max(w, h));
      SC.canvas.width = Math.round(w * s); SC.canvas.height = Math.round(h * s);
      var cx = SC.canvas.getContext('2d'); cx.drawImage(img, 0, 0, SC.canvas.width, SC.canvas.height);
      URL.revokeObjectURL(url);
      var hecho = function (txt) { if (!txt || !leido(txt)) { if (!txt) $('scanStatus').textContent = 'No se ha encontrado ningún QR en la foto. Acercaos un poco más y repetidla.'; } };
      if ('BarcodeDetector' in window) {
        try { new BarcodeDetector({ formats: ['qr_code'] }).detect(SC.canvas).then(function (cs) { hecho(cs && cs.length ? cs[0].rawValue : decodificarCanvas()); }).catch(function () { hecho(decodificarCanvas()); }); return; } catch (e) {}
      }
      hecho(decodificarCanvas());
    };
    img.onerror = function () { $('scanStatus').textContent = 'No se ha podido abrir la foto.'; };
    img.src = url;
  };
  function decodificarCanvas() {
    var cx = SC.canvas.getContext('2d'), d = cx.getImageData(0, 0, SC.canvas.width, SC.canvas.height);
    var code = window.jsQR && jsQR(d.data, SC.canvas.width, SC.canvas.height, { inversionAttempts: 'attemptBoth' });
    return code ? code.data : null;
  }

  // ───── Arranque ─────
  (function init() {
    var desdeTarjeta = INIT.t;
    var guardado = store(KEY);
    if (desdeTarjeta && desdeTarjeta !== guardado) {
      api('apiJoin', desdeTarjeta).then(function (eq) { setEquipo(eq); toast('¡Bienvenidos, ' + eq.nombre + '!'); continuar(); })
        .catch(function (e) { pantallaLogin(cleanMsg(e)); });
    } else if (guardado) {
      S.codigo = guardado; continuar();
    } else {
      pantallaLogin();
    }
  })();
</script>
</body>
</html>
