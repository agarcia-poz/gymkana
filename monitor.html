  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; }
  .hidden { display: none !important; }
  .logo { aspect-ratio: 480 / 296; -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; flex: none; }
  /* login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(900px 500px at 85% -10%, #CFE6FB 0%, rgba(207,230,251,0) 60%), linear-gradient(180deg, #fff, #E4F1FD); }
  .login .box { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 24px 50px -30px rgba(11,79,168,.5); }
  .login .logo { width: 110px; margin: 0 auto 12px; background: var(--blue); }
  .login h1 { font-family: 'Poppins', sans-serif; font-weight: 800; color: var(--navy); font-size: 24px; margin: 4px 0; }
  .login p { color: var(--muted); margin: 0 0 16px; }
  .login input { width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 24px; letter-spacing: .3em; text-align: center; font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--navy); }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 14px; background: var(--grad); color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 16px; margin-top: 12px; }
  .err { color: var(--err); font-weight: 700; margin-top: 10px; }
  /* barra */
  .top { position: sticky; top: 0; z-index: 5; background: var(--grad); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .top .logo { width: 54px; background: #fff; }
  .top .t { line-height: 1.15; }
  .top .t b { font-family: 'Poppins', sans-serif; font-size: 15px; letter-spacing: .02em; display: block; }
  .top .t small { opacity: .85; font-size: 12.5px; }
  .state { margin-left: auto; text-align: right; }
  .state b { font-family: 'Poppins', sans-serif; font-size: 18px; font-variant-numeric: tabular-nums; display: block; }
  .state small { font-size: 12px; opacity: .85; display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5AD38A; display: inline-block; }
  .dot.warn { background: #F5B942; } .dot.off { background: #E57373; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px 14px 40px; }
  .picker { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .picker label { font-weight: 700; color: var(--navy); white-space: nowrap; font-size: 14px; }
  .picker select { flex: 1; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; background: #fff; font-weight: 700; color: var(--navy); min-width: 0; }
  .aviso { margin-top: 12px; background: var(--err); color: #fff; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
  .aviso b { display: block; font-family: 'Poppins', sans-serif; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  .aviso button { margin-left: auto; background: rgba(255,255,255,.2); color: #fff; border-radius: 10px; padding: 4px 10px; font-weight: 700; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 12px; box-shadow: 0 12px 30px -24px rgba(11,79,168,.5); }
  .station { display: flex; gap: 14px; align-items: center; background: var(--grad); color: #fff; border: none; }
  .letter { width: 74px; height: 74px; border-radius: 18px; background: #fff; color: var(--navy); display: grid; place-items: center; font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 40px; flex: none; box-shadow: 0 8px 18px -8px rgba(0,0,0,.4); position: relative; }
  .letter small { position: absolute; bottom: 5px; font-size: 11px; font-weight: 700; color: var(--muted); }
  .station h2 { font-family: 'Poppins', sans-serif; font-weight: 800; margin: 0; font-size: 21px; line-height: 1.15; }
  .station p { margin: 4px 0 0; opacity: .9; font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
  .kpi b { display: block; font-family: 'Poppins', sans-serif; font-size: 26px; line-height: 1.1; color: var(--navy); }
  .kpi span { font-size: 12px; color: var(--muted); font-weight: 700; }
  .kpi.now b { color: var(--bright); } .kpi.ok b { color: var(--ok); }
  h3 { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; color: var(--navy); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  h3 .n { background: var(--pale); color: var(--blue); border-radius: 99px; padding: 0 9px; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: none; }
  .tdot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px rgba(0,0,0,.05); }
  .row .name { font-weight: 800; color: var(--ink); }
  .row .meta { font-size: 13px; color: var(--muted); }
  .row .right { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 800; }
  .pill.now { background: var(--pale); color: var(--blue); } .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.idle { background: #EEF2F7; color: var(--muted); } .pill.fin { background: var(--navy); color: #fff; }
  .now-card { border: 2px solid var(--bright); }
  .empty { color: var(--muted); font-size: 14px; padding: 4px 0; }
  .bar { height: 7px; border-radius: 99px; background: var(--pale); overflow: hidden; width: 90px; display: inline-block; vertical-align: middle; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .nota { background: #FFF6DF; border: 1.5px solid #F2D27E; border-radius: 14px; padding: 12px 14px; margin-top: 12px; color: #5C4300; }
  .nota b { display: block; font-family: 'Poppins', sans-serif; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #8A6400; margin-bottom: 4px; }
  .nota div { white-space: pre-wrap; font-size: 15px; line-height: 1.45; }
  .tip { background: var(--pale); color: var(--navy); border-radius: 14px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
  details summary { cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--navy); font-size: 15px; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 40; display: none; max-width: 90%; text-align: center; }
  .toast.on { display: block; }
  .foot { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 18px; }
  .foot button { background: none; text-decoration: underline; color: var(--muted); }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="box">
    <div class="logo"></div>
    <h1>Monitores de prueba</h1>
    <p>Piezas de una vocación · Seguimiento de equipos</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <button class="btn" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="logo"></div>
    <div class="t"><b>MONITORES</b><small>Piezas de una vocación</small></div>
    <div class="state"><b id="clock">--:--</b><small><i class="dot" id="dot"></i><span id="stateTxt">Conectando…</span></small></div>
  </div>
  <div class="wrap">
    <div class="picker"><label for="sel">Mi prueba</label><select id="sel"></select></div>
    <div id="avisoBox"></div>
    <div id="view"></div>
    <div class="foot">Actualización automática cada 5 segundos · <button id="logout">Salir</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var M = { pin: null, ver: 0, data: null, skew: 0, fallos: 0, busy: false, avisoVisto: 0 };
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function sstore(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
function toast(t) { var x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { x.classList.remove('on'); }, 3200); }
function now() { return Date.now() + M.skew; }
function hora(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function hace(ts) { var m = Math.floor((now() - ts) / 60000); return m < 1 ? 'ahora mismo' : 'hace ' + m + ' min'; }
function clean(e) { return String(e && e.message || e).replace(/^(Exception|Error):\s*/, ''); }

// ── API (igual que en las otras páginas: reintentos ante cortes)
function llamarApi(fn, args, ms) {
  var url = window.GYMKANA_API || '';
  if (!url || /PEGA_AQUI/.test(url)) return Promise.reject(new Error('Falta configurar la dirección de Apps Script en config.js.'));
  var ctrl = window.AbortController ? new AbortController() : null, tm = ctrl && setTimeout(function () { ctrl.abort(); }, ms);
  var red = function (msg) { var e = new Error(msg); e.red = true; return e; };
  return fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { if (!r.ok) throw red('El servidor no responde (' + r.status + ')'); return r.text(); })
    .then(function (t) { clearTimeout(tm); var j; try { j = JSON.parse(t); } catch (x) { throw red('Respuesta no válida del servidor.'); } if (!j.ok) throw new Error(j.error); return j.result; })
    .catch(function (e) { clearTimeout(tm); if (e && e.red) throw e; if (e && e.name === 'AbortError') throw red('El servidor tarda en responder.'); if (e instanceof TypeError) throw red('No hay conexión con el servidor.'); throw e; });
}
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1), n = 0;
  function intento() { return llamarApi(fn, args, 25000).catch(function (e) { if (e.red && n < 3) { n++; return new Promise(function (r) { setTimeout(r, 800 * n + Math.random() * 600); }).then(intento); } throw e; }); }
  return intento();
}

// ── Entrada
function login(pin) {
  $('loginBtn').disabled = true;
  api('monitorLogin', pin).then(function () {
    M.pin = pin; sstore('pdv_mon', pin);
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    refresh(true); bucle(); setInterval(tick, 1000);
  }).catch(function (e) { $('loginBtn').disabled = false; $('loginErr').textContent = clean(e); sstore('pdv_mon', ''); });
}
$('loginBtn').onclick = function () { login($('pin').value.trim()); };
$('pin').onkeydown = function (e) { if (e.key === 'Enter') $('loginBtn').onclick(); };
$('logout').onclick = function () { sstore('pdv_mon', ''); location.reload(); };
if (sstore('pdv_mon')) login(sstore('pdv_mon'));

function bucle() { setTimeout(function () { refresh().then(bucle, bucle); }, M.fallos ? Math.min(20000, 5000 * (1 + M.fallos)) : 5000); }
function refresh(force) {
  if (M.busy && !force) return Promise.resolve(); M.busy = true;
  return llamarApi('monitorDashboard', [M.pin, force ? 0 : M.ver], 12000).then(function (d) {
    M.busy = false; M.fallos = 0; M.skew = d.ahora - Date.now();
    $('dot').className = 'dot';
    if (!d.same) { M.ver = d.ver; M.data = d; pintarSelector(); }
    pintar(); tick();
  }).catch(function (e) {
    M.busy = false;
    if (/PIN/.test(clean(e))) { sstore('pdv_mon', ''); location.reload(); return; }
    M.fallos++; $('dot').className = 'dot ' + (M.fallos < 3 ? 'warn' : 'off'); $('stateTxt').textContent = M.fallos < 3 ? 'Reconectando…' : 'Sin conexión';
  });
}
function tick() {
  var d = M.data; if (!d) return;
  if (!d.inicio) { $('clock').textContent = '--:--'; $('stateTxt').textContent = 'Sala de espera'; return; }
  var s = Math.max(0, Math.floor(((d.fin || now()) - d.inicio) / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  $('clock').textContent = (h ? h + ':' : '') + ('0' + m).slice(-2) + ':' + ('0' + ss).slice(-2);
  if (M.fallos === 0) $('stateTxt').textContent = d.fin ? 'Terminada' : 'En marcha';
}

// ── Selector de prueba
function pintarSelector() {
  var sel = $('sel'), prev = sel.value || store('pdv_mon_est') || 'general';
  sel.innerHTML = '';
  var g = el('option', '', '📊 Vista general'); g.value = 'general'; sel.appendChild(g);
  M.data.puntos.filter(function (p) { return p.tipo === 'prueba' || p.tipo === 'inicio'; }).forEach(function (p) {
    var o = el('option', '', (p.tipo === 'inicio' ? '🏁 ' : '🧩 ') + p.nombre + (p.tipo === 'inicio' ? ' (reto final)' : '')); o.value = String(p.orden); sel.appendChild(o);
  });
  sel.value = Array.prototype.some.call(sel.options, function (o) { return o.value === prev; }) ? prev : 'general';
}
$('sel').onchange = function () { store('pdv_mon_est', $('sel').value); pintar(); };

// ── Cálculos
function nombrePunto(o) { var p = M.data.puntos.filter(function (x) { return x.orden === o; })[0]; return p ? p.nombre : '—'; }
function visitados(t) { var v = {}; t.escaneos.forEach(function (s) { v[s.orden] = s.ts; }); return v; }
// Cuántos lugares le faltan al equipo para llegar a la estación (0 = es su siguiente destino)
// Recorrido circular por los puntos 1…N-1 (tras el último viene el 1); el Patio solo cuenta al final
function distancia(t, est) {
  if (t.esperado === '' || t.esperado === null || t.esperado === undefined) return null;
  if (Number(est) === 0) return Number(t.esperado) === 0 ? 0 : null;
  if (Number(t.esperado) === 0) return null;
  var NP = M.data.puntos.length - 1, v = visitados(t), k = 0;
  for (var i = 0; i < NP; i++) {
    var c = ((Number(t.esperado) - 1 + i) % NP) + 1;
    if (c === Number(est)) return k;
    if (!v[c]) k++;
  }
  return null;
}
function estadoEquipo(t) {
  var d = M.data;
  if (t.finalizado) return ['fin', '🏆 Finalizado'];
  if (d.fin) return ['idle', 'Actividad terminada'];
  if (t.completo) return ['ok', '🏁 Vuelve al Patio'];
  if (!d.inicio) return ['idle', 'En sala de espera'];
  var ref = t.ultimo ? t.ultimo.ts : d.inicio, min = (now() - ref) / 60000;
  if (min >= 15) return ['warn', '⚠ ' + Math.floor(min) + ' min sin avanzar'];
  return ['now', 'En marcha'];
}

// ── Avisos de la coordinación
function pintarAviso() {
  var box = $('avisoBox'); box.innerHTML = '';
  var a = (M.data.avisos || []).slice(-1)[0]; if (!a) return;
  var visto = Number(store('pdv_mon_aviso') || 0);
  if (a.ts <= visto) return;
  var d = el('div', 'aviso'); d.appendChild(el('div', '', '📣'));
  var t = el('div'); t.appendChild(el('b', '', 'Aviso de la coordinación · ' + hora(a.ts))); t.appendChild(el('div', '', a.texto)); d.appendChild(t);
  var b = el('button', '', 'OK'); b.onclick = function () { store('pdv_mon_aviso', String(a.ts)); pintarAviso(); }; d.appendChild(b);
  box.appendChild(d);
  if (M.avisoVisto !== a.ts) { M.avisoVisto = a.ts; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
}

// ── Vistas
function filaEquipo(t, derecha, meta) {
  var r = el('div', 'row'); var dt = el('span', 'tdot'); dt.style.background = t.color; r.appendChild(dt);
  var c = el('div'); c.appendChild(el('div', 'name', t.nombre)); if (meta) c.appendChild(el('div', 'meta', meta)); r.appendChild(c);
  if (derecha) { var rt = el('div', 'right'); if (typeof derecha === 'string') rt.textContent = derecha; else rt.appendChild(derecha); r.appendChild(rt); }
  return r;
}
function seccion(titulo, lista, cls) {
  var c = el('div', 'card' + (cls ? ' ' + cls : '')); var h = el('h3', '', titulo); h.appendChild(el('span', 'n', String(lista.length))); c.appendChild(h);
  return c;
}
function pintar() {
  var d = M.data; if (!d) return;
  pintarAviso();
  var v = $('view'); v.innerHTML = '';
  var selv = $('sel').value;
  if (selv === 'general') return pintarGeneral(v);
  var est = Number(selv), p = d.puntos.filter(function (x) { return x.orden === est; })[0]; if (!p) return pintarGeneral(v);
  var head = el('div', 'card station');
  var L = el('div', 'letter', p.tipo === 'inicio' ? '🏁' : (p.letra || '?')); if (p.anio && p.tipo !== 'inicio') L.appendChild(el('small', '', p.anio)); head.appendChild(L);
  var ht = el('div'); ht.appendChild(el('h2', '', p.nombre)); ht.appendChild(el('p', '', p.tipo === 'inicio' ? 'Reto final: cofre y mural' : 'Prueba · entregad esta letra al superarla')); head.appendChild(ht);
  v.appendChild(head);

  var toca = [], cerca = [], hechos = [], lejos = [], fuera = [];
  d.equipos.forEach(function (t) {
    var vis = visitados(t);
    if (p.tipo === 'inicio') {
      if (t.finalizado) hechos.push(t); else if (t.completo) toca.push(t); else lejos.push(t);
      return;
    }
    if (vis[est]) { hechos.push(t); return; }
    if (!d.inicio || d.fin) { fuera.push(t); return; }
    var k = distancia(t, est);
    if (k === 0) toca.push(t); else if (k !== null && k <= 3) { t._k = k; cerca.push(t); } else lejos.push(t);
  });
  if (p.nota && String(p.nota).trim()) {
    var nt = el('div', 'nota'); nt.appendChild(el('b', '', '📝 Nota de la coordinación')); nt.appendChild(el('div', '', String(p.nota).trim())); v.appendChild(nt);
  }
  var k = el('div', 'kpis');
  [['now', toca.length, p.tipo === 'inicio' ? 'Volviendo' : 'Os toca'], ['', cerca.length, 'Se acercan'], ['ok', hechos.length + '/' + d.equipos.length, p.tipo === 'inicio' ? 'Finalizados' : 'Superada']].forEach(function (x) {
    var b = el('div', 'kpi ' + x[0]); b.appendChild(el('b', '', String(x[1]))); b.appendChild(el('span', '', x[2])); k.appendChild(b);
  });
  v.appendChild(k);

  if (!d.inicio) v.appendChild(el('div', 'tip', '⏳ La actividad aún no ha empezado. Cuando la coordinación dé la salida, aquí verás qué equipos vienen hacia tu prueba.'));
  if (d.fin) v.appendChild(el('div', 'tip', '🏁 La actividad ha terminado.'));

  var c1 = seccion(p.tipo === 'inicio' ? '🏁 Han completado el recorrido: vienen al Patio' : '🔔 Os toca ahora (vienen o están en la prueba)', toca, 'now-card');
  if (!toca.length) c1.appendChild(el('div', 'empty', 'Ningún equipo en este momento.'));
  toca.forEach(function (t) {
    var meta = t.ultimo ? 'Último lugar: ' + nombrePunto(t.ultimo.orden) + ' · ' + hace(t.ultimo.ts) : 'Sale hacia aquí desde el Patio';
    c1.appendChild(filaEquipo(t, (t.hechos) + '/' + t.total, meta));
  });
  v.appendChild(c1);

  if (p.tipo !== 'inicio') {
    var c2 = seccion('🚶 Se acercan', cerca);
    if (!cerca.length) c2.appendChild(el('div', 'empty', 'Nadie a menos de 3 lugares.'));
    cerca.sort(function (a, b) { return a._k - b._k; }).forEach(function (t) {
      c2.appendChild(filaEquipo(t, 'a ' + t._k + ' lugar' + (t._k > 1 ? 'es' : ''), t.ultimo ? 'Ahora por: ' + nombrePunto(t.ultimo.orden) : 'Aún no han escaneado'));
    });
    v.appendChild(c2);
  }

  var c3 = seccion(p.tipo === 'inicio' ? '✅ Han terminado' : '✅ Ya la han superado', hechos);
  if (!hechos.length) c3.appendChild(el('div', 'empty', 'Todavía ninguno.'));
  hechos.sort(function (a, b) { return (visitados(b)[est] || 0) - (visitados(a)[est] || 0); }).forEach(function (t) {
    var ts = p.tipo === 'inicio' ? null : visitados(t)[est];
    c3.appendChild(filaEquipo(t, ts ? hora(ts) : '🏆', null));
  });
  v.appendChild(c3);

  var resto = lejos.concat(fuera);
  if (resto.length) {
    var c4 = el('div', 'card'); var det = el('details'); det.appendChild(el('summary', '', '⏳ Aún lejos (' + resto.length + ')'));
    resto.forEach(function (t) { det.appendChild(filaEquipo(t, t.hechos + '/' + t.total, t.ultimo ? 'Por: ' + nombrePunto(t.ultimo.orden) : null)); });
    c4.appendChild(det); v.appendChild(c4);
  }
  if (p.tipo !== 'inicio') v.appendChild(el('div', 'tip', '💡 Al superar la prueba: entregad la letra y mostrad el QR para que lo escaneen. Si hay un problema, avisad a la coordinación.'));
}

function pintarGeneral(v) {
  var d = M.data;
  var fin = d.equipos.filter(function (t) { return t.finalizado; }).length;
  var marcha = d.equipos.filter(function (t) { return d.inicio && !d.fin && !t.finalizado; }).length;
  var media = d.equipos.length ? Math.round(d.equipos.reduce(function (a, t) { return a + t.hechos; }, 0) / d.equipos.length) : 0;
  var k = el('div', 'kpis');
  [['now', marcha, 'En marcha'], ['', media + '/' + (d.puntos.length - 1), 'Media de lugares'], ['ok', fin, 'Finalizados']].forEach(function (x) {
    var b = el('div', 'kpi ' + x[0]); b.appendChild(el('b', '', String(x[1]))); b.appendChild(el('span', '', x[2])); k.appendChild(b);
  });
  v.appendChild(k);
  var c = el('div', 'card'); var h = el('h3', '', '📊 Todos los equipos'); h.appendChild(el('span', 'n', String(d.equipos.length))); c.appendChild(h);
  if (!d.equipos.length) c.appendChild(el('div', 'empty', 'Todavía no hay equipos.'));
  d.equipos.slice().sort(function (a, b) { return (b.finalizado - a.finalizado) || (b.hechos - a.hechos); }).forEach(function (t) {
    var e = estadoEquipo(t), right = el('div');
    var bar = el('span', 'bar'), i = el('i'); i.style.width = Math.round(100 * t.hechos / t.total) + '%'; i.style.background = t.color; bar.appendChild(i);
    right.appendChild(bar); right.appendChild(el('div', '', t.hechos + '/' + t.total));
    var meta = el('span'); meta.appendChild(el('span', 'pill ' + e[0], e[1]));
    if (t.ultimo && !t.finalizado) meta.appendChild(document.createTextNode(' · ' + nombrePunto(t.ultimo.orden) + ' (' + hace(t.ultimo.ts) + ')'));
    var r = filaEquipo(t, right, null); r.children[1].appendChild(el('div', 'meta')).appendChild(meta);
    c.appendChild(r);
  });
  v.appendChild(c);
}
</script>
</body>
</html>
